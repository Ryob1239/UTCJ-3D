<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>404 — Página no encontrada</title>
  <style>
    :root{color-scheme:dark;--bg:#061321;--text:#eef7ff;--muted:#9fb4c8;--line:rgba(255,255,255,.12);--accent:#0d80e8}
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;font-family:Inter,Segoe UI,Arial,sans-serif;background:radial-gradient(circle at 50% 15%,#113654 0,#061321 48%);color:var(--text)}
    body{min-height:100vh;display:grid;place-items:center;padding:24px}
    main{text-align:center;width:min(650px,100%)}
    .code{font-size:clamp(82px,20vw,170px);font-weight:900;letter-spacing:-.07em;line-height:.85;background:linear-gradient(145deg,#34a4ff,#0d5fa8);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:0 20px 55px rgba(13,128,232,.18)}
    h1{font-size:clamp(24px,5vw,38px);margin:24px 0 10px}
    p{margin:0 auto;color:var(--muted);max-width:520px;line-height:1.6;font-size:15px}
    .line{width:74px;height:3px;border-radius:999px;background:var(--accent);margin:24px auto}
    .small{font-size:12px;color:#718aa1;margin-top:24px}
  </style>
</head>
<body>
  <main>
    <div class="code">404</div>
    <h1>Página no encontrada</h1>
    <div class="line"></div>
    <p>La página que intentas visitar no está disponible en este momento. Verifica la dirección o inténtalo nuevamente más tarde.</p>
    <div class="small">Campus 3D</div>
  </main>
</body>
</html>
